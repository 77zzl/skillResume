<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{NAME}} - {{TARGET_ROLE}}</title>
  <style>
    @page { size: A4; margin: 0; }
    :root { --ink:#17313a; --muted:#60747a; --accent:#0f766e; --pale:#e8f4f1; --line:#d7e4e1; }
    * { box-sizing:border-box; }
    body { margin:0; background:#f2f6f5; color:var(--ink); font-family:"Aptos","Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif; font-size:10px; line-height:1.42; }
    .resume { width:210mm; min-height:297mm; margin:0 auto; padding:14mm 15mm 11mm; background:#fff; }
    .hero { display:flex; justify-content:space-between; gap:16px; align-items:flex-start; }
    .name { margin:0; font-size:27px; line-height:1.05; letter-spacing:.02em; color:#12333b; }
    .headline { margin:7px 0 0; color:var(--accent); font-size:12px; font-weight:700; letter-spacing:.04em; }
    .contact { max-width:48%; padding-top:3px; text-align:right; color:var(--muted); font-size:9.5px; line-height:1.7; }
    .contact span { white-space:nowrap; }
    .rule { height:4px; margin:11px 0 13px; background:linear-gradient(90deg,var(--accent),#8fd0c4 72%,#fff); border-radius:2px; }
    .layout { display:grid; grid-template-columns:58mm 1fr; gap:12mm; }
    aside { border-right:1px solid var(--line); padding-right:8mm; }
    main { min-width:0; }
    .section { margin:0 0 13px; }
    .section.hidden { display:none; }
    h2 { margin:0 0 6px; color:var(--accent); font-size:11px; letter-spacing:.12em; text-transform:uppercase; }
    h2::after { content:""; display:block; width:22px; margin-top:4px; border-bottom:2px solid var(--accent); }
    h3 { margin:0; font-size:10.5px; line-height:1.35; color:#17313a; }
    p { margin:0; }
    .summary { margin-bottom:14px; padding:9px 10px; background:var(--pale); border-left:3px solid var(--accent); font-size:10.5px; line-height:1.6; }
    .skill-group { margin:0 0 8px; }
    .skill-group h3 { color:#28545a; font-size:9.5px; }
    .skill-group p { margin-top:2px; color:var(--muted); line-height:1.55; }
    .entry { margin:0 0 11px; break-inside:avoid; }
    .entry-heading { display:flex; justify-content:space-between; gap:8px; align-items:baseline; }
    .entry-heading span { flex:0 0 auto; color:var(--muted); font-size:9px; }
    .muted { color:var(--muted); font-size:9px; }
    ul { margin:4px 0 0; padding-left:14px; }
    li { margin:2px 0; }
    .tags { margin-top:2px; color:var(--accent); font-size:8.5px; }
    .education-item { margin-bottom:9px; }
    .education-item > p:not(.muted) { margin-top:2px; color:#28545a; }
    footer { margin-top:6px; padding-top:6px; border-top:1px solid var(--line); color:#8a9b9e; font-size:8px; text-align:right; }
    @media print { body { background:#fff; } .resume { margin:0; } }
  </style>
</head>
<body>
  <article class="resume">
    <header class="hero">
      <div>
        <h1 class="name">{{NAME}}</h1>
        <p class="headline">{{HEADLINE}}</p>
      </div>
      <div class="contact">{{CONTACT}}</div>
    </header>
    <div class="rule"></div>
    <div class="layout">
      <aside>
        <section class="section">
          <h2>目标方向</h2>
          <p>{{TARGET_ROLE}}</p>
        </section>
        <section class="section {{SKILLS_CLASS}}">
          <h2>核心能力</h2>
          {{SKILLS}}
        </section>
        <section class="section {{EDUCATION_CLASS}}">
          <h2>教育经历</h2>
          {{EDUCATION}}
        </section>
      </aside>
      <main>
        <section class="section">
          <h2>个人概览</h2>
          <p class="summary">{{SUMMARY}}</p>
        </section>
        <section class="section {{EXPERIENCE_CLASS}}">
          <h2>工作经历</h2>
          {{EXPERIENCE}}
        </section>
        <section class="section {{PROJECTS_CLASS}}">
          <h2>项目经历</h2>
          {{PROJECTS}}
        </section>
      </main>
    </div>
    <footer>{{FOOTER}}</footer>
  </article>
</body>
</html>
