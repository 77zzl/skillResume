<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{NAME}} - {{TARGET_ROLE}}</title>
  <style>
    @page { size:A4; margin:0; }
    :root { --ink:#1d2737; --muted:#647286; --navy:#183b56; --blue:#286b8f; --line:#d5dee6; --pale:#f3f7fa; }
    * { box-sizing:border-box; }
    body { margin:0; background:#edf2f5; color:var(--ink); font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif; font-size:9.8px; line-height:1.45; }
    .resume { width:210mm; min-height:297mm; margin:0 auto; padding:15mm 16mm 11mm; background:#fff; }
    .hero { display:grid; grid-template-columns:1fr 62mm; gap:12mm; align-items:start; min-height:38mm; padding-bottom:10px; border-bottom:4px solid var(--navy); }
    .identity { min-width:0; padding-top:2px; }
    .visuals { display:flex; align-items:flex-start; justify-content:flex-end; gap:8px; min-width:0; }
    .portrait { width:25mm; height:33mm; object-fit:contain; border:1px solid var(--line); background:#f9fbfd; }
    .qr-block { display:flex; flex-direction:column; align-items:center; gap:3px; }
    .qr-code { width:28mm; height:28mm; object-fit:contain; }
    .qr-label { color:var(--muted); font-size:8px; white-space:nowrap; }
    .name { margin:0; color:var(--navy); font-family:Georgia,"Microsoft YaHei",serif; font-size:26px; line-height:1.05; letter-spacing:.02em; }
    .headline { margin:6px 0 0; color:var(--blue); font-size:11px; font-weight:700; letter-spacing:.05em; }
    .contact { color:var(--muted); font-size:9px; line-height:1.7; text-align:left; }
    .contact span { white-space:nowrap; }
    .section { margin:0 0 12px; break-inside:avoid; }
    .section.hidden { display:none; }
    .layout { display:grid; grid-template-columns:58mm 1fr; gap:12mm; }
    aside { border-right:1px solid var(--line); padding-right:8mm; }
    main { min-width:0; }
    .intro { margin:12px 0 13px; padding:9px 11px; background:var(--pale); border-left:3px solid var(--blue); }
    h2 { margin:0 0 6px; color:var(--navy); font-family:Georgia,"Microsoft YaHei",serif; font-size:11px; letter-spacing:.08em; }
    h2::before { content:"/  "; color:var(--blue); }
    h3 { margin:0; font-size:10.4px; line-height:1.35; }
    p { margin:0; }
    .summary { line-height:1.6; }
    .skills-grid { display:grid; grid-template-columns:1fr; gap:7px; }
    .skill-group h3 { color:var(--blue); font-size:9.6px; }
    .skill-group p { margin-top:2px; color:var(--muted); }
    .entry { margin:0 0 10px; padding-left:9px; border-left:1px solid var(--line); break-inside:avoid; }
    .entry-heading { display:flex; justify-content:space-between; gap:8px; align-items:baseline; }
    .entry-heading span { flex:0 0 auto; color:var(--muted); font-size:8.8px; }
    .muted { color:var(--muted); font-size:8.8px; }
    ul { margin:3px 0 0; padding-left:14px; }
    li { margin:2px 0; }
    .tags { margin-top:2px; color:var(--blue); font-size:8.4px; }
    .education-item { margin-bottom:7px; }
    .education-item > p:not(.muted) { margin-top:2px; color:var(--blue); }
    footer { margin-top:5px; padding-top:6px; border-top:1px solid var(--line); color:#8a98a7; font-size:8px; text-align:right; }
    @media print { body { background:#fff; } .resume { margin:0; } }
  </style>
</head>
<body>
  <article class="resume">
    <header class="hero">
      <div class="identity">
        <h1 class="name">{{NAME}}</h1>
        <p class="headline">{{HEADLINE}}</p>
        <div class="contact">{{CONTACT}}</div>
      </div>
      <div class="visuals">{{VISUALS}}</div>
    </header>
    <main>
    <div class="layout">
      <aside>
        <section class="section">
          <h2>目标方向</h2>
          <p>{{TARGET_ROLE}}</p>
        </section>
        <section class="section {{SKILLS_CLASS}}">
          <h2>技术能力</h2>
          <div class="skills-grid">{{SKILLS}}</div>
        </section>
        <section class="section {{EDUCATION_CLASS}}">
          <h2>教育经历</h2>
          {{EDUCATION}}
        </section>
      </aside>
      <main>
        <section class="section intro">
          <h2>研究与职业概览 · {{TARGET_ROLE}}</h2>
          <p class="summary">{{SUMMARY}}</p>
        </section>
        <section class="section {{EXPERIENCE_CLASS}}">
          <h2>经历</h2>
          {{EXPERIENCE}}
        </section>
        <section class="section {{PROJECTS_CLASS}}">
          <h2>研究与工程项目</h2>
          {{PROJECTS}}
        </section>
      </main>
    </div>
    </main>
    <footer>{{FOOTER}}</footer>
  </article>
</body>
</html>
